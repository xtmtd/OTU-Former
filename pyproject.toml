[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "otuformer"
version = "0.2.1"
description = "Image-based morphological OTU delineation toolkit"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "torch>=2.1",
    "timm>=1.0",
    "torchvision>=0.16",
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "scikit-bio>=0.6",
    "umap-learn>=0.5",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "grad-cam>=1.5",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "onnxscript>=0.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
otuformer = "otuformer.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/otuformer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/otuformer"]
